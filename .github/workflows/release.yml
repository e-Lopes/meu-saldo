name: Publicar APK Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configurar assinatura original
        env:
          MEUSALDO_KEYSTORE_BASE64: ${{ secrets.MEUSALDO_KEYSTORE_BASE64 }}
          MEUSALDO_STORE_PASSWORD: ${{ secrets.MEUSALDO_STORE_PASSWORD }}
          MEUSALDO_KEY_ALIAS: ${{ secrets.MEUSALDO_KEY_ALIAS }}
          MEUSALDO_KEY_PASSWORD: ${{ secrets.MEUSALDO_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py
      - name: Compilar APK sem executar testes
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          bash ./gradlew --no-daemon assembleRelease --console=plain
      - name: Preparar APK e informações de atualização
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [ "$REF_TYPE" = tag ]; then args+=(--tag "$REF_NAME"); fi
          python scripts/prepare_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            "${args[@]}"
      - name: Publicar release completa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(python -c 'import json; print("v" + json.load(open(".dist/release/update.json"))["versionName"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Esta versão já existe. Aumente versionCode e versionName; releases publicadas não serão sobrescritas.'
            exit 1
          fi
          gh release create "$tag" .dist/release/meu-saldo.apk .dist/release/update.json \
            --target "$GITHUB_SHA" --title "Meu Saldo ${tag#v}" --notes-file release/notes.md --latest
      - name: Remover credenciais do runner
        if: always()
        run: rm -f -- .tools/github-release.jks keystore.properties
