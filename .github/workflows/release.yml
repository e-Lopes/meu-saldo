name: Gerar candidato Android

on:
  push:
    branches: [main]
    paths:
      - app.json
      - release/notes.md
      - .github/workflows/release.yml
      - scripts/check_release.py
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar automaticamente depois de compilar e verificar
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Conferir se a versão ainda precisa ser publicada
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python scripts/check_release.py
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar projeto Expo
        run: |
          npm ci
          npm run validate
          npm test
          npm run release:check
          python scripts/prepare_release.py --check-config
          npx expo prebuild --platform android --no-install
      - name: Configurar assinatura original após as validações
        env:
          MEUSALDO_KEYSTORE_BASE64: ${{ secrets.MEUSALDO_KEYSTORE_BASE64 }}
          MEUSALDO_STORE_PASSWORD: ${{ secrets.MEUSALDO_STORE_PASSWORD }}
          MEUSALDO_KEY_ALIAS: ${{ secrets.MEUSALDO_KEY_ALIAS }}
          MEUSALDO_KEY_PASSWORD: ${{ secrets.MEUSALDO_KEY_PASSWORD }}
        run: python scripts/configure_ci_signing.py
      - name: Compilar APK sem executar testes
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          bash ./android/gradlew -p android --no-daemon assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 --console=plain
      - name: Preparar APK e informações de atualização
        run: |
          python scripts/prepare_release.py \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Disponibilizar candidato para validação manual
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meu-saldo-candidate
          path: .dist/release/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Identificar o candidato
        env:
          AUTO_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          echo "Candidato: execução $GITHUB_RUN_ID, commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO_PUBLISH" = "true" ]; then
            echo 'Publicação automática após as verificações técnicas. A conferência em aparelho físico permanece separada.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Baixe meu-saldo-candidate, confira o APK no celular e publique escolhendo este ID no workflow Publicar candidato Android.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conferir novamente o APK antes da publicação automática
        if: github.event_name == 'push' || inputs.publish
        run: |
          python scripts/prepare_release.py --verify-only \
            --apk .dist/release/meu-saldo.apk --output .dist/release \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Publicar automaticamente o mesmo APK e marcar como latest
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_DIR: .dist/release
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
        run: python scripts/publish_candidate.py
      - name: Remover credenciais do runner
        if: always()
        run: rm -f -- .tools/github-release.jks keystore.properties
